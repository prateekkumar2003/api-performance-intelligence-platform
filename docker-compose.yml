services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    # ports: now nginx will handle the routing, so we don't need to expose the backend port directly
    #   - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: redis
    restart: always

  celery:
    build: ./backend
    container_name: celery
    restart: always
    # This command starts a Celery worker for your Django project
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis

  celery-beat:
    build: ./backend
    container_name: celery-beat
    restart: always
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: