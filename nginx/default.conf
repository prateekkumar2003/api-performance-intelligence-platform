server {
    listen 80;

    location / {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host; # stored in host variable, passed to backend
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# These lines in NGINX pass original client request information from Nginx
# to your Django backend.
#
# Without them, the backend may only see:
# - Requests coming from the Nginx container
# - Not the actual user/client details
#
# Configuration:
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#
# 1. Host Header
#    proxy_set_header Host $host;
#
# Passes the original hostname to Django.
#
# Example request:
# http://myapi.com/api/health/
#
# The backend receives:
# Host: myapi.com
#
# Why is it important?
# - ALLOWED_HOSTS validation
# - Domain-specific logic
# - URL generation
# - Security checks
#
# Without this header, the backend may instead see:
# Host: backend
#
# 2. Real Client IP
#    proxy_set_header X-Real-IP $remote_addr;
#
# Passes the actual client IP.
#
# Example:
# User IP: 192.168.1.10
#
# Django receives:
# X-Real-IP: 192.168.1.10
#
# Without this header, Django may only see the IP address
# of the Nginx container.
#
# Useful for:
# - Logging
# - Rate limiting
# - Audit trails
# - Analytics
# - Security monitoring
#
# 3. Forwarded Proxy Chain
#    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#
# Tracks the complete proxy chain.
#
# Example:
# Client -> Load Balancer -> Nginx -> Django
#
# Header:
# X-Forwarded-For: 192.168.1.10, 10.0.0.5
#
# Difference:
# - X-Real-IP: Immediate client IP.
# - X-Forwarded-For: Complete chain of proxy/client IPs.
